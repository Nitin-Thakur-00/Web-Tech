<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Technology Experiments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --bg-fade: #0a0a0a;
            --card-glass: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #888888;
            --neon-white: #ffffff;
            --neon-glow: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ambient-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 60px 20px 30px;
            width: 100%;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--neon-white);
            text-shadow: 0 0 5px var(--neon-glow);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            padding: 0 20px 80px;
        }

        .card {
            background: var(--card-glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 30px 45px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 6px;
            height: 100%;
            background: var(--neon-white);
            transform: scaleY(0);
            transition: transform 0.3s ease;
            box-shadow: 0 0 10px var(--neon-white);
        }

        .card:hover {
            transform: translateX(15px);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .card:hover::before {
            transform: scaleY(1);
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0;
            line-height: 1;
            transition: color 0.3s ease;
            text-align: center;
        }

        footer {
            margin-top: auto;
            padding: 40px;
            color: #555;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                padding: 0 20px 40px;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <header>
        <h1>Web Technology</h1>
        <p class="subtitle">Experiments</p>
    </header>

    <div class="dashboard-grid">
        <a href="Exp_1/index.html" class="card">
            <h2>Experiment 1</h2>
        </a>
        <a href="Exp_2/index.html" class="card">
            <h2>Experiment 2</h2>
        </a>
        <a href="Exp_3/index.html" class="card">
            <h2>Experiment 3</h2>
        </a>
        <a href="Exp_4/index.html" class="card">
            <h2>Experiment 4</h2>
        </a>
        <a href="Exp_5/index.html" class="card">
            <h2>Experiment 5</h2>
        </a>
        <a href="Exp_6/index.html" class="card">
            <h2>Experiment 6</h2>
        </a>
        <a href="Exp_7/index.html" class="card">
            <h2>Experiment 7</h2>
        </a>
        <a href="https://github.com/Nitin-Thakur-00/Web-Tech/tree/main/Exp_8" target="_blank" class="card">
            <h2>Experiment 8</h2>
        </a>
        <a href="https://webtech.xo.je/" target="_blank" class="card">
            <h2>Experiment 9</h2>
        </a>
        <a href="https://webtech.xo.je/" target="_blank" class="card">
            <h2>Experiment 10</h2>
        </a>
    </div>

    <footer>
        &copy; 2026 Developed By Nitin Thakur
    </footer>
</body>

</html>
